# 纯 Rust 的 dav1d 垫片：对外保持 crates.io `dav1d` 0.11.0 的 API 形状，
# 内部直接 re-export re_rav1d（Rust 版 dav1d），避免 C 工具链（meson/ninja/NASM）。
# 由 src-tauri/Cargo.toml 的 [patch.crates-io] 生效，供 image 的 avif-native 使用。
[package]
name = "dav1d"
version = "0.11.0"
edition = "2021"

[dependencies]
re_rav1d = { version = "=0.1.3", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
