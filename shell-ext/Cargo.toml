[package]
name = "hive-shell-ext"
version = "1.0.2"
edition = "2021"
description = "Windows 11 context menu shell extension for Hive Viewer"
license = "MIT"

[lib]
name = "hive_shell_ext"
crate-type = ["cdylib"]

[dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
windows-core = "0.61"

[profile.release]
opt-level = "s"
lto = true
